name: CI Workflow
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs: 
  runTest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: testDB
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared model
        run: npm run build -w @ecom/shared

      - name: Run web tests
        run: npm run test -w web
      
      - name: Run api tests
        run: npm run test -w api
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          PEPPER: ${{secrets.PEPPER}}
         

      

