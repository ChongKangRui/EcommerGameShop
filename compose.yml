services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: RedfieldGamingDB
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql
      - ./apps/api/migrations/BackupData/BackupRedfieldGamingTable.sql:/docker-entrypoint-initdb.d/01-restore.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "npm run build -w @ecom/shared && npm run dev -w api"
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PORT: 5432
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: RedfieldGamingDB
    env_file:
      - apps/api/.env
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared/node_modules
    depends_on:
      db:
        condition: service_healthy  # Wait for health check to pass
    

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "npm run build -w @ecom/shared && npm run dev -w web -- --host"
    env_file:
      - apps/web/.env
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared/node_modules
    depends_on:
      - api

volumes:
  db-data: